name: Extract Assets Locally

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Official secure step that pulls assets directly from your Release files automatically
      - name: Download Asset Zip from Release
        uses: robinraju/release-downloader@v1.11
        with:
          latest: true
          fileName: "Content.zip"
          out-file-path: "original"

      # Now that the file is pulled down into the folder, we can safely unzip it
      - name: Unzip Local Content Archive
        run: |
          mkdir -p raw_content
          unzip -o original/Content.zip -d raw_content/

      # Uses the runner's built-in Python engine to organize files internally
      - name: Process and Sort Texture Trees
        run: |
          mkdir -p src/Content
          python3 -c "
          import os, shutil
          source_dir = 'raw_content'
          target_dir = 'src/Content'
          
          for root, dirs, files in os.walk(source_dir):
              for file in files:
                  if file.endswith('.xnb') or file.endswith('.png'):
                      rel_path = os.path.relpath(root, source_dir)
                      dest_folder = os.path.join(target_dir, rel_path)
                      os.makedirs(dest_folder, exist_ok=True)
                      shutil.copy2(os.path.join(root, file), os.path.join(dest_folder, file))
          print('Asset structures organized locally.')
          "

      - name: Clean Up Temporary Workspace
        run: rm -rf raw_content

      - name: Commit and Push Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git add src/Content/
          
          if git diff-index --quiet HEAD --; then
            echo "No changes to asset data detected"
          else
            git commit -m "chore: localize and sort content asset trees"
            git push origin HEAD:${{ github.ref_name }}
          fi
