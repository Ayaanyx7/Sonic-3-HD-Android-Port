name: Decompile Sonic 3 HD

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs the complete Mono framework to execute the engine on Ubuntu Linux
      - name: Setup Mono Runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel mono-runtime unzip

      - name: Install ILSpy CLI
        run: dotnet tool install --global ilspycmd

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Downloads the exact compiled archive asset cleanly via GitHub's native backend engine
      - name: Fetch De4dot Binary Bundle
        uses: suisei-cn/actions-download-file@v1.6.0
        with:
          url: "https://github.com/ViRb3/de4dot-cex/releases/download/v4.0.0/de4dot-cex.zip"
          target: .
          filename: de4dot.zip

      - name: Unpack Deobfuscator
        run: |
          mkdir -p de4dot_bin
          unzip de4dot.zip -d de4dot_bin

      # Deobfuscates using Mono to cleanly pass the tech demo through the translation layer
      - name: Deobfuscate Executable
        run: |
          mkdir -p cleaned
          mono de4dot_bin/de4dot.exe "original/Sonic 3 HD Tech Demo.exe" -o "cleaned/sonic3hd_clean.exe"

      # FIXED: Uses the exact syntax option matching the ILSpy console parser specification
      - name: Decompile Sonic 3 HD
        run: |
          mkdir -p src
          ilspycmd \
            -p \
            --nested-directories \
            -lv CSharp5 \
            -o src \
            "cleaned/sonic3hd_clean.exe"

      - name: Commit and Push Source Code
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add src/
          
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "chore: deobfuscate and decompile via native action downloader"
            git push origin HEAD:${{ github.ref_name }}
          fi
