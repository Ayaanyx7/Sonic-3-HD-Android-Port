name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Forces the host runner to ignore its pre-installed .NET environment and stick to .NET 8
      - name: Force .NET 8 SDK Rollback
        shell: bash
        run: |
          echo '{"sdk": {"version": "8.0.400", "rollForward": "latestMinor"}}' > global.json
          mkdir -p android
          echo '{"sdk": {"version": "8.0.400", "rollForward": "latestMinor"}}' > android/global.json

      # Sets up .NET 8, which is the foundational engine framework for modern MonoGame
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Java is strictly required by the Android SDK to compile APK application bundles
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Installs the official Microsoft Android build tools onto the cloud server
      - name: Install .NET Android Workload
        run: dotnet workload install android

      # Installs the missing MonoGame engine build tools directly onto the cloud compiler runner
      - name: Install MonoGame Engine Build Tools
        run: |
          dotnet tool install -g dotnet-mgcb
          dotnet tool install -g dotnet-mgcb-editor

      # Handles ONLY the critical desktop Windows Form stubbing in GClass25 safely
      - name: Patch Windows Forms Reference
        run: |
          echo "Applying native window framework stubs..."
          find src/ -name "GClass25.cs" -type f -exec sed -i '/using System.Windows.Forms;/d' {} +
          find src/ -name "GClass25.cs" -type f -exec sed -i 's/Form form = (Form)Control.FromHandle(base.Window.Handle);/bool formIsMinimized = false;/g' {} +
          find src/ -name "GClass25.cs" -type f -exec sed -i 's/if (form.WindowState != FormWindowState.Minimized)/if (!formIsMinimized)/g' {} +
          echo "Done!"

      - name: Restore Dependencies
        run: dotnet restore android/Sonic3HDAndroid.csproj -p:CheckEolTargetFramework=false

      # Compiles and forces .NET 8 to package the actual application archive package
      - name: Compile and Package Android APK
        run: |
          dotnet publish android/Sonic3HDAndroid.csproj \
            -c Release \
            -f net8.0-android \
            -p:CheckEolTargetFramework=false \
            -p:CreatePackagePerAbi=true \
            -p:AndroidBuildApplicationPackage=true \
            -p:AndroidPackageFormat=apk

      # Deep sweeps the entire repository folder structure to find the newly compiled game file
      - name: Deep Search and Stage Android Package
        run: |
          mkdir -p drop
          echo "Scanning workspace for compiled Android distribution files..."
          find . -type f -name "*.apk" -exec cp {} drop/ \;
          find . -type f -name "*.aab" -exec cp {} drop/ \;
          echo "Staged files configuration summary:"
          ls -la drop/

      # Targets our staging folder to upload whatever installer asset was generated
      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3HD-Android-Release-Build
          path: drop/*
