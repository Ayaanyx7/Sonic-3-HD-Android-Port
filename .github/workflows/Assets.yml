name: Extract XNA Assets to PNG

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Uses your exact, direct URL to download the zip without any broken variables
      - name: Fetch Content Zip from Release
        run: |
          curl -L -o Content.zip "https://github.com/Ayaanyx7/Sonic-3-HD-Android-Port/releases/download/Assets/Content.zip"

      - name: Unzip Compressed Raw Content
        run: |
          mkdir -p raw_content
          unzip -o Content.zip -d raw_content/

      # Fetch the verified compiled xnbcli utility directly using curl
      - name: Download xnbcli Unpacker
        run: |
          curl -L -o xnbcli.zip "https://github.com"

      - name: Setup xnbcli Engine Utility
        run: |
          mkdir -p xnbcli_tool
          unzip xnbcli.zip -d xnbcli_tool/
          chmod +x xnbcli_tool/xnbcli

      # Runs the tool across your assets directory structure
      - name: Extract XNB Textures to Native PNGs
        run: |
          mkdir -p src/Content
          ./xnbcli_tool/xnbcli unpack raw_content src/Content

      # Clean up the cloud machine workspace before committing
      - name: Clean Up Temporary System Workspace
        run: |
          rm -rf raw_content
          rm -rf xnbcli_tool
          rm -f Content.zip
          rm -f xnbcli.zip

      - name: Commit and Push Extracted PNG Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add src/Content/
          
          if git diff-index --quiet HEAD --; then
            echo "No changes to asset data detected"
          else
            git commit -m "chore: unpack and populate asset texture trees as native PNGs"
            git push origin HEAD:${{ github.ref_name }}
          fi
