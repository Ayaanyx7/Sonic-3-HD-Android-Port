name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Forces the host runner to ignore its pre-installed .NET environment and stick to .NET 8
      - name: Force .NET 8 SDK Rollback
        shell: bash
        run: |
          echo '{"sdk": {"version": "8.0.400", "rollForward": "latestMinor"}}' > global.json
          mkdir -p android
          echo '{"sdk": {"version": "8.0.400", "rollForward": "latestMinor"}}' > android/global.json

      # Sets up .NET 8, which is the foundational engine framework for modern MonoGame
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Java is strictly required by the Android SDK to compile APK application bundles
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Installs the official Microsoft Android build tools onto the cloud server
      - name: Install .NET Android Workload
        run: dotnet workload install android

      # Installs the missing MonoGame engine build tools directly onto the cloud compiler runner
      - name: Install MonoGame Engine Build Tools
        run: |
          dotnet tool install -g dotnet-mgcb
          dotnet tool install -g dotnet-mgcb-editor

      # Unpacks the 2012 Windows XNB files to raw files, maps them, and builds Android XNBs via pre-built binaries
      - name: Automated XNB Extraction and Mobile Rebuild Pipeline
        run: |
          # 1. Download the official pre-compiled Linux binary from the release history (Bypasses all npm/C++ node-gyp issues)
          curl -L -o xnbcli-linux.zip https://github.com/LeonBlade/xnbcli/releases/download/v1.0.7/xnbcli-linux.zip
          mkdir -p xnbcli_bin
          unzip -o xnbcli-linux.zip -d xnbcli_bin/
          chmod +x xnbcli_bin/xnbcli
          
          # 2. Extract the legacy 2012 files to raw assets using the native binary execution string
          mkdir -p raw_content
          ./xnbcli_bin/xnbcli unpack src/Content raw_content
          
          # 3. Create a clean destination and write the base MGCB configuration file
          mkdir -p android_content
          cat << 'EOF' > android_content/Content.mgcb
          #----------------------------- Global Properties ----------------------------#
          /outputDir:bin/Android
          /intermediateDir:obj/Android
          /platform:Android
          /config:
          /profile:Reach
          /compress:False
          
          #---------------------------------- Content ---------------------------------#
          EOF

          # 4. Use Python to parse the extracted raw trees, normalize casing, and populate the layout
          python3 -c "
          import os, shutil
          source_dir = 'raw_content'
          target_dir = 'android_content'
          mgcb_path = 'android_content/Content.mgcb'
          
          with open(mgcb_path, 'a') as f:
              for root, dirs, files in os.walk(source_dir):
                  for file in files:
                      if file.endswith('.png') or file.endswith('.wav') or file.endswith('.mp3'):
                          rel_path = os.path.relpath(root, source_dir)
                          path_parts = rel_path.split(os.sep)
                          
                          # Sanitize folder loops and drop duplicate folder text
                          lowercase_parts = [p.lower() for p in path_parts if p and p.lower() != 'content' and p != '.']
                          
                          # Generate clean lower-cased operational pathing
                          dest_folder = os.path.join(target_dir, *lowercase_parts)
                          os.makedirs(dest_folder, exist_ok=True)
                          
                          lower_filename = file.lower()
                          shutil.copy2(os.path.join(root, file), os.path.join(dest_folder, lower_filename))
                          
                          # Calculate manifest entries without leading folder text dots
                          build_src = os.path.join(*lowercase_parts, lower_filename).replace('\\\\', '/')
                          build_dest = os.path.splitext(build_src)[0]
                          f.write(f'/build:{build_src};{build_dest}\n')
          "
          
          # 5. Compile everything into mobile OpenGL formatting via modern MGCB
          cd android_content
          mgcb /@:Content.mgcb
          cd ..
          
          # 6. Realign directories into your main src folder tree
          rm -rf src/Content
          mkdir -p src/Content
          cp -r android_content/bin/Android src/Content/

      # Handles ONLY the critical desktop Windows Form stubbing in GClass25 safely 
      - name: Decompiler Syntax Code Patching
        run: |
          echo "Repairing broken decompiler syntax patterns..."
          
          # 1. Clear out desktop Windows Forms dependencies inside the main engine loop (GClass25)
          find src/ -name "GClass25.cs" -type f -exec sed -i '/using System.Windows.Forms;/d' {} +
          find src/ -name "GClass25.cs" -type f -exec sed -i 's/Form form = (Form)Control.FromHandle(base.Window.Handle);/bool formIsMinimized = false;/g' {} +
          find src/ -name "GClass25.cs" -type f -exec sed -i 's/if (form.WindowState != FormWindowState.Minimized)/if (!formIsMinimized)/g' {} +
          
          # Fix the specific raw GamePad back-button signature and RenderTarget usage in GClass25
          find src/ -name "GClass25.cs" -type f -exec sed -i 's/\.Back == 1/\.Back == ButtonState.Pressed/g' {} +
          find src/ -name "GClass25.cs" -type f -exec sed -i 's/, 1, 2);/, 1, (Microsoft.Xna.Framework.Graphics.RenderTargetUsage)2);/g' {} +

          # 2. Fix CS1503: KEYBOARD STATE INTEGER-TO-ENUM MISMATCH
          # Safely wraps raw numeric keyboard checks (like IsKeyDown(37)) into explicit (Keys) enums
          find src/ -name "*.cs" -type f -exec sed -i -E 's/\.IsKeyDown\(([0-9]+)\)/.IsKeyDown((Keys)\1)/g' {} +

          # 3. Fix CS8026 Range Operator Collision & CS0165 Unassigned Variables
          find src/ -name "*.cs" -type f -exec sed -i -E 's/Color (white|color|color_[0-9]+);/Color \1 = Microsoft.Xna.Framework.Color.White;/g' {} +
          find src/ -name "*.cs" -type f -exec sed -i -E 's/([A-Za-z0-9_]+\.\.ctor\(.*\);)/\/\/ COMPILER FIX: \1/g' {} +

          # 4. Fix CS0266 SpriteEffects Assignment Casting Mismatches
          find src/ -name "*.cs" -type f -exec sed -i -E 's/\.spriteEffects_([0-9]+) = ([0-9]+);/\.spriteEffects_\1 = (SpriteEffects)\2;/g' {} +

          # 5. Clean away leftover obfuscation navigation markers
          find src/ -name "*.cs" -type f -exec sed -i -E 's/goto IL_[A-Za-z0-9_]+;/\/\/ Wiped/g' {} +
          find src/ -name "*.cs" -type f -exec sed -i -E 's/^[[:space:]]*IL_[A-Za-z0-9_]+:[[:space:]]*//g' {} +
          
          echo "Decompiler syntax repair completed successfully!"
      - name: Restore Dependencies
        run: dotnet restore android/Sonic3HDAndroid.csproj -p:CheckEolTargetFramework=false

      # Compiles and forces .NET 8 to package the actual application archive package
      - name: Compile and Package Android APK
        run: |
          dotnet publish android/Sonic3HDAndroid.csproj \
            -c Release \
            -f net8.0-android \
            -p:CheckEolTargetFramework=false \
            -p:CreatePackagePerAbi=true \
            -p:AndroidBuildApplicationPackage=true \
            -p:AndroidPackageFormat=apk

      # Deep sweeps the entire repository folder structure to find the newly compiled game file
      - name: Deep Search and Stage Android Package
        run: |
          mkdir -p drop
          echo "Scanning workspace for compiled Android distribution files..."
          find . -type f -name "*.apk" -exec cp {} drop/ \;
          find . -type f -name "*.aab" -exec cp {} drop/ \;
          echo "Staged files configuration summary:"
          ls -la drop/

      # Targets our staging folder to upload whatever installer asset was generated
      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3HD-Android-Release-Build
          path: drop/*
