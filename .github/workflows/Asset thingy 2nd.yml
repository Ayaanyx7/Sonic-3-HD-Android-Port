name: 1. Process and Commit Assets

on:
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Crucial: Gives the workflow permission to push code to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MonoGame Engine Build Tools
        run: |
          dotnet tool install -g dotnet-mgcb
          dotnet tool install -g dotnet-mgcb-editor

      - name: Automated XNB Extraction and Mobile Rebuild Pipeline
        run: |
          # 1. Download the pre-compiled Linux binary extractor
          curl -L -o xnbcli-linux.zip https://github.com/LeonBlade/xnbcli/releases/download/v1.0.7/xnbcli-linux.zip
          mkdir -p xnbcli_bin
          unzip -o xnbcli-linux.zip -d xnbcli_bin/
          chmod +x xnbcli_bin/xnbcli
          
          # 2. Extract the legacy 2012 files to raw assets
          mkdir -p raw_content
          ./xnbcli_bin/xnbcli unpack src/Content raw_content
          
          # 3. Create a clean destination and write the base MGCB configuration file
          mkdir -p android_content
          cat << 'EOF' > android_content/Content.mgcb
          #----------------------------- Global Properties ----------------------------#
          /outputDir:bin/Android
          /intermediateDir:obj/Android
          /platform:Android
          /config:
          /profile:Reach
          /compress:False
          
          #---------------------------------- Content ---------------------------------#
          EOF
          
          # 4. Use Python to parse trees, lowercase everything, and generate the manifest
          python3 -c "
          import os, shutil
          source_dir = 'raw_content'
          target_dir = 'android_content'
          mgcb_path = 'android_content/Content.mgcb'
          
          with open(mgcb_path, 'a') as f:
              for root, dirs, files in os.walk(source_dir):
                  for file in files:
                      if file.endswith('.png') or file.endswith('.wav') or file.endswith('.mp3'):
                          rel_path = os.path.relpath(root, source_dir)
                          path_parts = rel_path.split(os.sep)
                          lowercase_parts = [p.lower() for p in path_parts if p and p.lower() != 'content' and p != '.']
                          dest_folder = os.path.join(target_dir, *lowercase_parts)
                          os.makedirs(dest_folder, exist_ok=True)
                          lower_filename = file.lower()
                          shutil.copy2(os.path.join(root, file), os.path.join(dest_folder, lower_filename))
                          build_src = os.path.join(*lowercase_parts, lower_filename).replace('\\\\', '/')
                          build_dest = os.path.splitext(build_src)[0]
                          f.write(f'/build:{build_src};{build_dest}\n')
          "
          
          # 5. Compile assets to Android OpenGL format
          cd android_content
          mgcb /@:Content.mgcb
          cd ..
          
          # 6. Wipe out any old outputs and drop the fresh files into the repository asset folder
          rm -rf src/MobileContent
          mkdir -p src/MobileContent
          cp -r android_content/bin/Android/* src/MobileContent/

      # 7. Automatically commits the newly generated assets back into your repository branch
      - name: Commit and Push Processed Assets to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git add src/MobileContent/
          
          if git diff-index --quiet HEAD --; then
            echo "No asset shifts or changes detected. Repository is already up to date."
          else
            git commit -m "chore: dynamically rebuild and store mobile asset trees [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
