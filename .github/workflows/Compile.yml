name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Forces the host runner to ignore its pre-installed .NET environment and stick to .NET 8
      - name: Force .NET 8 SDK Rollback
        shell: bash
        run: |
          echo '{"sdk": {"version": "8.0.400", "rollForward": "latestMinor"}}' > global.json
          mkdir -p android
          echo '{"sdk": {"version": "8.0.400", "rollForward": "latestMinor"}}' > android/global.json

      # Sets up .NET 8, which is the foundational engine framework for modern MonoGame
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Java is strictly required by the Android SDK to compile APK application bundles
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Installs the official Microsoft Android build tools onto the cloud server
      - name: Install .NET Android Workload
        run: dotnet workload install android

      # Installs the missing MonoGame engine build tools directly onto the cloud compiler runner
      - name: Install MonoGame Engine Build Tools
        run: |
          dotnet tool install -g dotnet-mgcb
          dotnet tool install -g dotnet-mgcb-editor

      # Automatically cleans up the final decompiler bugs globally across all classes
      - name: Decompiler Syntax Code Patching
        run: |
          echo "Executing hyper-targeted code syntax cleanup..."
          
          # 1. WINDOWS DESKTOP HOOK REMOVAL (GClass25)
          find src/ -name "GClass25.cs" -type f -exec sed -i '/using System.Windows.Forms;/d' {} +
          find src/ -name "GClass25.cs" -type f -exec sed -i 's/Form form = (Form)Control.FromHandle(base.Window.Handle);/bool formIsMinimized = false;/g' {} +
          find src/ -name "GClass25.cs" -type f -exec sed -i 's/if (form.WindowState != FormWindowState.Minimized)/if (!formIsMinimized)/g' {} +
          find src/ -name "GClass25.cs" -type f -exec sed -i 's/\.Back == 1/\.Back == ButtonState.Pressed/g' {} +
          find src/ -name "GClass25.cs" -type f -exec sed -i 's/, 1, 2);/, 1, (Microsoft.Xna.Framework.Graphics.RenderTargetUsage)2);/g' {} +

          # 2. INJECT MISSING XNA GRAPHICS & INPUT DIRECTIVES GLOBALLY
          find src/ -name "*.cs" -type f -exec sed -i '1s/^/using Microsoft.Xna.Framework.Graphics;\nusing Microsoft.Xna.Framework.Input;\n/' {} +

          # 3. FIX CS0165: PRE-INITIALIZE GENERIC LOCAL VARIABLES TO PREVENT BUILD CRASHES
          find src/ -name "*.cs" -type f -exec sed -i -E 's/Color (white|color|color_[0-9]+);/Color \1 = Microsoft.Xna.Framework.Color.White;/g' {} +
          find src/ -name "*.cs" -type f -exec sed -i -E 's/Vector2 ([A-Za-z0-9_]+);/Vector2 \1 = Microsoft.Xna.Framework.Vector2.Zero;/g' {} +
          find src/ -name "*.cs" -type f -exec sed -i -E 's/Rectangle ([A-Za-z0-9_]+);/Rectangle \1 = Microsoft.Xna.Framework.Rectangle.Empty;/g' {} +

          # 4. FIX CONSTRUCTOR RANGE OPERATOR COLLISION (Wipes out the explicit structural ..ctor statement tokens entirely)
          find src/ -name "*.cs" -type f -exec sed -i -E 's/([A-Za-z0-9_]+\.\.ctor\(.*\);)/\/\/ COMPILER FIX: \1/g' {} +
          find src/ -name "*.cs" -type f -exec sed -i -E 's/\.IsKeyDown\(([0-9]+)\)/.IsKeyDown((Keys)\1)/g' {} +

          # 5. FIX GClass29 STRAY EXPRESSIONS, MOUSE STATE, AND DRAW BEGIN SIGNATURES
          find src/ -name "GClass29.cs" -type f -exec sed -i -E 's/^[[:space:]]+[A-Za-z0-9_]+_0;/\/\/ WIPED STRAY/g' {} +
          find src/ -name "GClass29.cs" -type f -exec sed -i 's/\.LeftButton == 1/\.LeftButton == ButtonState.Pressed/g' {} +
          find src/ -name "GClass29.cs" -type f -exec sed -i 's/\.Begin(1,/.Begin((SpriteSortMode)1, /g' {} +

          # 6. FIX SPRITEEFFECTS AND KEYBOARD INPUT SIGNATURE CONVERSIONS
          find src/ -name "*.cs" -type f -exec sed -i -E 's/SpriteEffects ([A-Za-z0-9_]+) = ([0-9]+);/SpriteEffects \1 = (SpriteEffects)\2;/g' {} +
          find src/ -name "*.cs" -type f -exec sed -i -E 's/\.spriteEffects_([0-9]+) = ([0-9]+);/\.spriteEffects_\1 = (SpriteEffects)\2;/g' {} +
          find src/ -name "*.cs" -type f -exec sed -i -E 's/ = ([0-9]+) \? SpriteEffects\.None/ = (SpriteEffects)\1 \? SpriteEffects.None/g' {} +
          find src/ -name "*.cs" -type f -exec sed -i -E 's/DrawingCalls\(([^,]+), ([0-9]+),/DrawingCalls\1, (SpriteEffects)\2,/g' {} +

          # 7. GENERAL NAVIGATION LABEL SWEEP AND DEAD CODE CLEANUP
          find src/ -name "*.cs" -type f -exec sed -i -E 's/goto IL_[A-Za-z0-9_]+;/\/\/ Wiped/g' {} +
          find src/ -name "*.cs" -type f -exec sed -i -E 's/^[[:space:]]*IL_[A-Za-z0-9_]+:[[:space:]]*//g' {} +
          echo "Done!"

      - name: Restore Dependencies
        run: dotnet restore android/Sonic3HDAndroid.csproj -p:CheckEolTargetFramework=false

      # Compiles and forces .NET 8 / MonoGame to package the actual application archive package
      - name: Compile and Package Android APK
        run: |
          dotnet publish android/Sonic3HDAndroid.csproj \
            -c Release \
            -f net8.0-android \
            -r android-arm64 \
            -p:CheckEolTargetFramework=false \
            -p:CreatePackagePerAbi=true \
            -p:AndroidPackageFormat=apk \
            -p:AndroidBuildApplicationPackage=true

      # Deep sweeps the entire repository folder structure to find the newly compiled game file
      - name: Deep Search and Stage Android Package
        run: |
          mkdir -p drop
          echo "Scanning workspace for compiled Android distribution files..."
          find . -type f -name "*.apk" -exec cp {} drop/ \;
          find . -type f -name "*.aab" -exec cp {} drop/ \;
          echo "Staged files configuration summary:"
          ls -la drop/

      # Targets our staging folder to upload whatever installer asset was generated
      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonic3HD-Android-Release-Build
          path: drop/*
