name: Decompile Sonic 3 HD (dnSpy Engine)

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installs the complete Mono framework to execute native Windows .NET binaries on Ubuntu Linux
      - name: Setup Mono Runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel mono-runtime unzip

      # Fetches the original .NET Framework build of dnSpy (Crucial for flawless Mono execution)
      - name: Fetch dnSpy Engine Bundle
        uses: suisei-cn/actions-download-file@v1.6.0
        with:
          url: "https://github.com/dnSpy/dnSpy/releases/download/v6.1.8/dnSpy-netframework.zip"
          target: .
          filename: dnspy.zip

      - name: Unpack dnSpy Engine
        run: |
          mkdir -p dnspy_bin
          unzip dnspy.zip -d dnspy_bin

      # Downloads the exact deobfuscator engine specified
      - name: Fetch De4dot Binary Bundle
        uses: suisei-cn/actions-download-file@v1.6.0
        with:
          url: "https://github.com/ViRb3/de4dot-cex/releases/download/v4.0.0/de4dot-cex.zip"
          target: .
          filename: de4dot.zip

      - name: Unpack Deobfuscator
        run: |
          mkdir -p de4dot_bin
          unzip de4dot.zip -d de4dot_bin

      # Deobfuscates the executable using Mono before decompilation
      - name: Deobfuscate Executable
        run: |
          mkdir -p cleaned
          mono de4dot_bin/de4dot.exe "original/Sonic 3 HD Tech Demo.exe" -o "cleaned/sonic3hd_clean.exe"

      # RUNS DNSPY: Converts the assembly straight into clean, error-free C# files
      - name: Decompile Sonic 3 HD via dnSpy
        run: |
          mkdir -p src
          mono dnspy_bin/dnSpy.Console.exe \
            --project-output src \
            "cleaned/sonic3hd_clean.exe"

      # Commits the cleanly compiled source tree back to your repository branch
      - name: Commit and Push Source Code
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add src/
          
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "chore: deobfuscate and decompile cleanly using dnSpy engine"
            git push origin HEAD:${{ github.ref_name }}
          fi
