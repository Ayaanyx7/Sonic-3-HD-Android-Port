name: 1. Generate Content Manifest

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract legacy XNB assets
        run: |
          curl -L -o xnbcli-linux.zip https://github.com/LeonBlade/xnbcli/releases/download/v1.0.7/xnbcli-linux.zip
          mkdir -p xnbcli_bin
          unzip -o xnbcli-linux.zip -d xnbcli_bin/
          chmod +x xnbcli_bin/xnbcli
          mkdir -p raw_content
          ./xnbcli_bin/xnbcli unpack src/Content raw_content

      - name: Write Content.mgcb and copy in source assets
        run: |
          mkdir -p src/MobileContent
          cat << 'EOF' > src/MobileContent/Content.mgcb
          #----------------------------- Global Properties ----------------------------#
          /outputDir:bin/Android
          /intermediateDir:obj/Android
          /platform:Android
          /config:
          /profile:Reach
          /compress:False

          #---------------------------------- Content ---------------------------------#
          EOF

          python3 -c "
          import os, shutil
          source_dir = 'raw_content'
          target_dir = 'src/MobileContent'
          mgcb_path = 'src/MobileContent/Content.mgcb'

          with open(mgcb_path, 'a') as f:
              for root, dirs, files in os.walk(source_dir):
                  for file in files:
                      if file.endswith(('.png', '.wav', '.mp3')):
                          rel_path = os.path.relpath(root, source_dir)
                          path_parts = rel_path.split(os.sep)
                          lowercase_parts = [p.lower() for p in path_parts if p and p.lower() != 'content' and p != '.']
                          dest_folder = os.path.join(target_dir, *lowercase_parts)
                          os.makedirs(dest_folder, exist_ok=True)
                          lower_filename = file.lower()
                          shutil.copy2(os.path.join(root, file), os.path.join(dest_folder, lower_filename))
                          build_src = os.path.join(*lowercase_parts, lower_filename).replace('\\\\', '/')
                          build_dest = os.path.splitext(build_src)[0]
                          f.write(f'/build:{build_src};{build_dest}\n')
          "

      - name: Commit manifest and source assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MobileContent/
          if git diff-index --quiet HEAD --; then
            echo "No changes."
          else
            git commit -m "chore: regenerate Content.mgcb and source assets"
            git push origin HEAD:${{ github.ref_name }}
          fi
