name: Extract XNA Assets to PNG

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up standard Node runtime environment for the xnbcli engine tools
      - name: Setup Node.js
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x' # Keep .NET context for pipeline stability if required

      # Downloads the exact 28.8MB raw Content.zip straight from your Release tag bypass
      - name: Fetch Content Zip from Release
        uses: suisei-cn/actions-download-file@v1.6.0
        with:
          url: "https://github.com{{ github.repository }}/releases/download/v0.0.1/Content.zip"
          target: .
          filename: Content.zip

      - name: Unzip Compressed Raw Content
        run: |
          mkdir -p raw_content
          unzip -o Content.zip -d raw_content/

      # Fetch the verified compiled standalone xnbcli utility package from official assets
      - name: Download xnbcli Unpacker
        uses: suisei-cn/actions-download-file@v1.6.0
        with:
          url: "https://github.com"
          target: .
          filename: xnbcli.zip

      - name: Setup xnbcli Engine Utility
        run: |
          mkdir -p xnbcli_tool
          unzip xnbcli.zip -d xnbcli_tool/
          chmod +x xnbcli_tool/xnbcli

      # Runs the unpacked binary tool across your assets directory structure
      - name: Extract XNB Textures to Native PNGs
        run: |
          mkdir -p src/Content
          # xnbcli unpacks source structures into target destinations recursively
          ./xnbcli_tool/xnbcli unpack raw_content src/Content

      - name: Clean Up Temporary System Workspace
        run: |
          rm -rf raw_content
          rm -rf xnbcli_tool
          rm Content.zip
          rm xnbcli.zip

      - name: Commit and Push Extracted PNG Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add src/Content/
          
          if git diff-index --quiet HEAD --; then
            echo "No changes to asset data detected"
          else
            git commit -m "chore: unpack and populate asset texture trees as native PNGs"
            git push origin HEAD:${{ github.ref_name }}
          fi
